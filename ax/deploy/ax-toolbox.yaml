apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-toolbox
  namespace: ax-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ax-toolbox
subjects:
  - kind: ServiceAccount
    name: ax-toolbox
    namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-toolbox
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-toolbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-toolbox
    spec:
      serviceAccountName: ax-toolbox
      containers:
        - name: toolbox
          image: localhost:5001/ax-toolbox:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AX_SERVER
              value: "http://ax-server.ax-system.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
