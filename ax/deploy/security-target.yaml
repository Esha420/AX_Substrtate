apiVersion: v1
kind: ConfigMap
metadata:
  name: security-target-script
  namespace: default
data:
  target_server.py: |
    import asyncio
    import socket

    HTTP_RESPONSE = (
        b"HTTP/1.1 200 OK\r\n"
        b"Server: nginx/1.24.0\r\n"
        b"Content-Type: text/html\r\n"
        b"X-Powered-By: PHP/8.1.2\r\n"
        b"Connection: close\r\n\r\n"
        b"<html><head><title>Corporate Portal</title></head>"
        b"<body><h1>Welcome to Corp Internal</h1>"
        b"<p>Notice: Unauthorized access prohibited.</p>"
        b"<a href='/api/v1'>API</a> <a href='/login'>Login</a></body></html>\r\n"
    )

    ADMIN_RESPONSE = (
        b"HTTP/1.1 401 Unauthorized\r\n"
        b"Server: Apache/2.4.52 (Ubuntu)\r\n"
        b"WWW-Authenticate: Basic realm=\"Internal Management\"\r\n"
        b"Content-Type: text/html\r\n"
        b"Connection: close\r\n\r\n"
        b"<html><body><h1>401 Restricted</h1></body></html>\r\n"
    )

    async def handle_ssh(reader, writer):
        writer.write(b"SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6\r\n")
        await writer.drain()
        await asyncio.sleep(2)
        try:
            writer.close()
            await writer.wait_closed()
        except Exception:
            pass

    async def handle_http(reader, writer):
        try:
            data = await reader.read(1024)
            writer.write(HTTP_RESPONSE)
            await writer.drain()
        except Exception:
            pass
        finally:
            try:
                writer.close()
                await writer.wait_closed()
            except Exception:
                pass

    async def handle_admin(reader, writer):
        try:
            data = await reader.read(1024)
            writer.write(ADMIN_RESPONSE)
            await writer.drain()
        except Exception:
            pass
        finally:
            try:
                writer.close()
                await writer.wait_closed()
            except Exception:
                pass

    async def handle_mysql(reader, writer):
        try:
            # MySQL handshake packet
            packet = (
                b"\x4a\x00\x00\x00\x0a"
                b"5.7.42-0ubuntu0.18.04.1\x00"
                b"\x01\x00\x00\x00"
                b"12345678\x00\xff\xf7\x08\x02\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
            )
            writer.write(packet)
            await writer.drain()
            await asyncio.sleep(1)
        except Exception:
            pass
        finally:
            try:
                writer.close()
                await writer.wait_closed()
            except Exception:
                pass

    async def main():
        s1 = await asyncio.start_server(handle_ssh, '0.0.0.0', 22)
        s2 = await asyncio.start_server(handle_http, '0.0.0.0', 80)
        s3 = await asyncio.start_server(handle_admin, '0.0.0.0', 8080)
        s4 = await asyncio.start_server(handle_mysql, '0.0.0.0', 3306)
        print("Mock Security Target running on ports 22 (SSH), 80 (HTTP), 8080 (Admin), 3306 (MySQL)")
        async with asyncio.TaskGroup() as tg:
            tg.create_task(s1.serve_forever())
            tg.create_task(s2.serve_forever())
            tg.create_task(s3.serve_forever())
            tg.create_task(s4.serve_forever())

    if __name__ == '__main__':
        asyncio.run(main())
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-target
  namespace: default
  labels:
    app: security-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-target
  template:
    metadata:
      labels:
        app: security-target
    spec:
      containers:
        - name: target
          image: python:3.12-slim
          command: ["python3", "-u", "/app/target_server.py"]
          ports:
            - containerPort: 22
              name: ssh
            - containerPort: 80
              name: http
            - containerPort: 8080
              name: admin
            - containerPort: 3306
              name: mysql
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: security-target-script
---
apiVersion: v1
kind: Service
metadata:
  name: security-target
  namespace: default
  labels:
    app: security-target
spec:
  selector:
    app: security-target
  ports:
    - name: ssh
      port: 22
      targetPort: 22
    - name: http
      port: 80
      targetPort: 80
    - name: admin
      port: 8080
      targetPort: 8080
    - name: mysql
      port: 3306
      targetPort: 3306
