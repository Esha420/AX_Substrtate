metadata:
  atespace: default
  name: state-probe-full
containers:
- name: guest
  image: localhost:5001/state-probe@sha256:7521115bc95405707df2f335096727f2748b566517833269a2dc6148e5f78779
  command:
  - python3
  - /app/probe.py
  env:
  - name: WORKSPACE
    value: /workspace
  - name: PROBE_HTTP_PORT
    value: "8080"
  volumeMounts:
  - mountPath: /workspace
    name: workspace
  wakeupProbe:
    httpGet:
      path: /status
      port: 8080
    timeoutSeconds: 30
sandboxConfig:
  configName: gvisor-default
  sandboxClass: SANDBOX_CLASS_GVISOR
snapshotConfig:
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  onPause: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: s3://ate-snapshots/
volumes:
- durableDir: {}
  name: workspace
