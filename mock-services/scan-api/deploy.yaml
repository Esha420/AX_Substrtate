apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-scan-api
  namespace: default
  labels:
    app: mock-scan-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-scan-api
  template:
    metadata:
      labels:
        app: mock-scan-api
    spec:
      containers:
        - name: mock-scan-api
          image: localhost:5001/mock-scan-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JOB_DELAY_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-scan-api
  namespace: default
  labels:
    app: mock-scan-api
spec:
  selector:
    app: mock-scan-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
