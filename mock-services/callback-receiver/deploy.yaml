apiVersion: apps/v1
kind: Deployment
metadata:
  name: callback-receiver
  namespace: ax-system
  labels:
    app: callback-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: callback-receiver
  template:
    metadata:
      labels:
        app: callback-receiver
    spec:
      containers:
        - name: callback-receiver
          image: localhost:5001/callback-receiver:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AX_SERVER_URL
              value: "http://ax-server.ax-system.svc.cluster.local:8080"
            - name: AX_CLI_BIN
              value: "/usr/local/bin/ax"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: callback-receiver
  namespace: ax-system
  labels:
    app: callback-receiver
spec:
  selector:
    app: callback-receiver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
