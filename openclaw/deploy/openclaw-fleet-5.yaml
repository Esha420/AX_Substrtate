# 5-Actor Heterogeneous Multiplexing Fleet
# Demonstrates scheduling 5 logical autonomous OpenClaw actors across 3 physical workers.
# Workloads exercise diverse real-world patterns (Research, Data, Monitoring, Document, Security)
# with independent external wait intervals, operation correlation, and dynamic worker reuse.
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: openclaw-research
  atespace: default
spec:
  image: "localhost:5001/openclaw-agent@sha256:cfb4987eac0df2a68a32b780f42c2a70d9dec780a9d2a63bf5441ddc3dc54d9f"
  command:
    - /bin/bash
    - /agent/run_workload.sh
  env:
    - name: TASK_NAME
      value: "openclaw-research"
    - name: ROLE
      value: "research"
    - name: SCAN_API_URL
      value: "http://external-scan-api:8080"
    - name: MCP_URL
      value: "http://external-mcp-server:8000/mcp"
    - name: WORKSPACE
      value: "/workspace"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector.otel-system.svc.cluster.local:4318"
    - name: OTEL_SERVICE_NAME
      value: "openclaw-research"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
  debug: true
---
